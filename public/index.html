<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>羽蚀纪：天空的悼亡曲</title>

    <link rel="stylesheet" href="css/login.css">
</head>


<body>

    <div class="login-page">

        <!-- 游戏标题 -->
        <div class="title-area">

            <h1>羽蚀纪</h1>

            <p>天空的悼亡曲</p>

        </div>


        <!-- 登录框 -->
        <div class="login-box">

            <h2>登录</h2>


            <input
                id="username"
                type="text"
                placeholder="请输入用户名"
            >


            <input
                id="password"
                type="password"
                placeholder="请输入密码"
            >


            <button id="login-button">
                登录
            </button>


            <div class="other-options">

                <button id="register-button">
                    注册
                </button>

                <button id="guest-button">
                    游客进入
                </button>

            </div>


            <p id="message"></p>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
