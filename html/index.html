<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽蚀纪-主页</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <div class="page">

        <!-- 游戏标题 -->
        <div class="title-area">
            <h1>羽蚀纪</h1>
            <p>天空的悼亡曲</p>
        </div>

        <!-- 主页内容 -->
        <div class="box box-wide">
            <div class="introduce">
                <h2>游戏简介</h2>
                <p>我与我周旋久，宁做我</p>
            </div>
            

            <h2>站点导航</h2>
            <ul class="nav">
                <button id="register-button" class="menu-button">新玩家注册账号</button>
                <button id="login-button" class="menu-button">已有账号，去登录</button>
                <button id="developers-button" class="menu-button">小组与成员信息</button>
            </ul>

            <div class = "tips">
                <h2>使用说明</h2>
                <p>1. 新用户请先注册账号</p>
                <p>2. 注册完成后返回登录</p>
                <p>3. 登录成功后开始游戏</p>
            </div>
            
        </div>

    </div>

    <script src="../js/index.js"></script>

</body>
</html>
