<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    min-height:100vh;
    background:url("../images/background5.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    font-family:"Microsoft YaHei",sans-serif;
    color:#222;
    padding:40px 20px;
}
.wrapper{
    max-width:850px;
    margin:0 auto;
    background:rgba(255,255,255,0.72);
    border-radius:16px;
    padding:40px;
    backdrop-filter:blur(6px);
    text-align:center;
}
.avatar-box{
    margin-bottom:28px;
}
.avatar-box img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #cad8f0;
}
h1{
    margin-bottom:24px;
    font-size:28px;
}
.desc{
    font-size:17px;
    line-height:1.85;
    margin-bottom:30px;
    text-align:center;
}
.back-link{
    display:inline-block;
    margin-top:10px;
    padding:10px 22px;
    background:#728fc7;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
.back-link:hover{
    background:#5b78ad;
}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="avatar-box">
        <img src="../images/photo5.jpg" alt="个人头像">
    </div>
    <h1>我的个人介绍</h1>
    <div class="desc">
<p>大家好，我是陈思宇。我性格开朗，喜好广泛。</p>
<br>
<p>在本次《羽蚀纪：天空的悼亡曲》小组项目中，我的主要分工是完成网站与游戏页面的代码编写，搭建整体网页框架，实现页面跳转、剧情交互等基础功能，保障整个站点可以正常运行。</p>
<br>
<p>希望你会喜欢我们的游戏！</p>
    <a class="back-link" href="group.html">返回小组成员介绍页</a>
</div>
</body>
</html>
