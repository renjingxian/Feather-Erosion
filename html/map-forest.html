<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="../js/transition.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽蚀纪｜森林区域地图</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
        }
        .map-wrap{
            width:100vw;
            height:100vh;
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#000;
        }
        .map-stage{
            position:relative;
            width:min(100%, calc(100vh * 16 / 9));
            aspect-ratio:16/9;
        }
        .forest-map-img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .hotspot{
            position:absolute;
            cursor:pointer;
            border-radius:4px;
            width:12%;
            height:7%;
        }
        .hotspot:hover{
            background:rgba(255,255,255,0.22);
            border:1px solid rgba(255,255,255,0.5);
        }
        .func-btn{
            position:absolute;
            left:30px;
            padding:10px 18px;
            background:rgba(0,0,0,0.55);
            color:#fff;
            border:1px solid #fff;
            border-radius:4px;
            cursor:pointer;
            font-size:16px;
            z-index:10;
        }
        .btn-back{
            bottom:120px;
        }
        /* 成就系统按钮 */
        .btn-ach{
            position:absolute;
            left:30px;
            bottom:30px;
            width:70px;
            height:70px;
            z-index:9999;
            cursor:pointer;
            transition:transform 0.2s ease;
        }
        .btn-ach img{
            width:100%;
            height:100%;
            object-fit:contain;
            display:block;
        }
        .btn-ach:hover{
            transform:scale(1.08);
        }
        .achievement-tip{
            position:absolute;
            top:50%;
            left:80px;
            transform:translateY(-50%);
            white-space:nowrap;
            padding:7px 12px;
            background:rgba(10,12,18,0.92);
            border:1px solid var(--gold-dim);
            border-radius:4px;
            color:var(--text);
            font-size:14px;
            opacity:0;
            visibility:hidden;
            pointer-events:none;
            transition:opacity 0.2s ease;
        }
        .btn-ach:hover .achievement-tip{
            opacity:1;
            visibility:visible;
        }
        .btn-item{
            bottom:30px;
            left:140px;
        }
        .func-btn:hover{
            background:rgba(255,255,255,0.25);
        }
        .action-hud{
            position:absolute;
            top:24px;
            left:24px;
            color:#ffffff;
            font-size:18px;
            text-shadow: 0 0 4px #000;
            z-index:10;
        }
        .custom-modal{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.35);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:100;
        }
        .modal-box{
            background:rgba(255,255,255,0.85);
            color:#222;
            padding:24px 32px;
            border-radius:8px;
            text-align:center;
        }
        .modal-box p{
            font-size:18px;
            margin-bottom:16px;
        }
        .modal-box button{
            padding:6px 16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="map-wrap">
        <div class="map-stage">
        <img src="../images/forest.jpg" alt="森林地图" class="forest-map-img">
        <!--德鲁伊环阵【上移】-->
        <div class="hotspot" style="top:4%;left:10%;" id="de"></div>
        <!--晨叶镇 左侧-->
        <div class="hotspot" style="top:38%;left:13%;" id="chen"></div>
        <!--古树根系【下移一半】-->
        <div class="hotspot" style="top:81.5%;left:17%;" id="gen"></div>
        <!--古树圣殿【上移一半】-->
        <div class="hotspot" style="top:0.5%;left:57%;" id="sheng"></div>
        <!--回声洞穴 最右上角-->
        <div class="hotspot" style="top:14%;left:90%;" id="dong"></div>
        <!--腐根沼泽【下移一半】-->
        <div class="hotspot" style="top:77.5%;left:74%;" id="zhao"></div>
        </div>
        <div class="action-hud">剩余行动点：<span id="apText">4</span></div>
        <div class="func-btn btn-back" id="backmap">返回世界大地图</div>
        <div class="btn-ach" onclick="turnNav('achievement.html')">
            <img src="../images/miniachieve.jpg" alt="成就系统">
            <div class="achievement-tip">成就</div>
        </div>
    </div>
    <script src="../js/bgm.js"></script>
    <script src="../js/turn.js"></script>
    <script src="../js/minimap.js"></script>
    <script src="../js/task.js"></script>
</body>
</html>
