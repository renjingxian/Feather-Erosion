<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>羽蚀纪｜帝国城邦地图</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
        }
        .map-wrap{
            width:100vw;
            height:100vh;
            position:relative;
        }
        .empire-map-img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        .hotspot{
            position:absolute;
            cursor:pointer;
            border-radius:4px;
            width:12%;
            height:7%;
        }
        .hotspot:hover{
            background:rgba(255,255,255,0.22);
            border:1px solid rgba(255,255,255,0.5);
        }
        .func-btn{
            position:absolute;
            left:30px;
            padding:10px 18px;
            background:rgba(0,0,0,0.55);
            color:#fff;
            border:1px solid #fff;
            border-radius:4px;
            cursor:pointer;
            font-size:16px;
            z-index:10;
        }
        .btn-back{
            bottom:90px;
        }
        .btn-ach{
            bottom:30px;
        }
        .btn-item{
            bottom:30px;
            left:140px;
        }
        .func-btn:hover{
            background:rgba(255,255,255,0.25);
        }
        .action-hud{
            position:absolute;
            top:24px;
            left:24px;
            color:#ffffff;
            font-size:18px;
            text-shadow: 0 0 4px #000;
            z-index:10;
        }
        .custom-modal{
            position:fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background:rgba(0,0,0,0.35);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:100;
        }
        .modal-box{
            background:rgba(255,255,255,0.85);
            color:#222;
            padding:24px 32px;
            border-radius:8px;
            text-align:center;
        }
        .modal-box p{
            font-size:18px;
            margin-bottom:16px;
        }
        .modal-box button{
            padding:6px 16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="map-wrap">
        <img src="../images/empire.jpg" alt="帝国城邦地图" class="empire-map-img">
        <div class="action-hud">剩余行动点：<span id="apText">4</span></div>
        <!--主线：蒸汽议会厅（地图中央标签，不消耗行动点）-->
        <div class="hotspot" style="top:22%;left:43%;" id="mainplot"></div>
        <!--符文工坊 左上标签-->
        <div class="hotspot" style="top:5.6%;left:9%;" id="fu"></div>
        <!--污染隔离区 右上标签【继续下移，改为top16%】-->
        <div class="hotspot" style="top:16%;left:84%;" id="wu"></div>
        <!--老兵墓地 左下标签-->
        <div class="hotspot" style="top:71%;left:14%;" id="lao"></div>
        <!--黑市巷道 右下标签-->
        <div class="hotspot" style="top:74%;left:87%;" id="hei"></div>
        <div class="func-btn btn-back" id="backmap">返回世界大地图</div>
        <div class="func-btn btn-ach" id="achievements">成就</div>
        <div class="func-btn btn-item" id="things">物品</div>
    </div>
    <script src="saveTool.js"></script>
    <script src="../js/minimap.js"></script>
</body>
</html>
