<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>注册-羽蚀纪</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>
    <div class="register-page">

        <!-- 游戏标题 -->

        <div class="title-area">

            <h1>羽蚀纪</h1>

            <p>天空的悼亡曲</p>

        </div>


        <!-- 注册区域 -->

        <div class="register-box">

            <h2>创建账号</h2>


            <input
                id="username"
                type="text"
                placeholder="请输入用户名"
            >


            <input
                id="password"
                type="password"
                placeholder="请输入密码"
            >


            <input
                id="confirm-password"
                type="password"
                placeholder="请再次输入密码"
            >


            <button id="register-button">
                注册
            </button>


            <button id="back-button">
                返回登录
            </button>


            <p id="message"></p>

        </div>

    </div>


    <script src="../js/auth.js"></script>

    <script src="../js/register.js"></script>

</body>
</html>
