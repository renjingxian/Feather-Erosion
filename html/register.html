<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册-羽蚀纪</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="page">

        <!-- 游戏标题 -->
        <div class="title-area">
            <h1>羽蚀纪</h1>
            <p>天空的悼亡曲</p>
        </div>

        <!-- 注册框 -->
        <div class="box">
            <h2>创建账号</h2>

            <input id="username" type="text" placeholder="请输入用户名">
            <input id="password" type="password" placeholder="请输入密码">
            <input id="confirm-password" type="password" placeholder="请再次输入密码">

            <button id="register-button" class="btn-primary">注册</button>
            <button id="back-button" class="btn-link">返回登录</button>
            <button id="home-button" class="btn-link">返回主页</button>

            <p id="message"></p>
        </div>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
