<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽蚀纪｜天空之城</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/story.css">
</head>
<body>
    <button id="exit-game-button" class="exit-game-button">退出游戏</button>
<div class="story-wrap">
    <div class="bg-layer" style="background-image:url('../images/bg_sky.jpg')"></div>

    <div class="cg-block" id="cgDom">
        <div class="cg-tip-text">【天空之城 · 场景CG】</div>
        <div class="skip-hint">点击画面任意位置跳过</div>
    </div>

    <div class="char-silhouette-wrap">
        <div class="char-silhouette" id="silhouetteDom"></div>
    </div>

    <div class="story-box" id="textDom"></div>
    <div class="option-box" id="choiceDom"></div>

    <div class="hint" id="hint">点击Enter/ Space/ ▸键 继续</div>
</div>

<script src="../js/save.js"></script>
<script src="../js/story-sky.js"></script>
</body>
</html>
