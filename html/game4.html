<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="../js/transition.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潜入审判穹顶</title>
<link rel="stylesheet" href="../css/common.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c1018;color:#fff;font-family:Microsoft YaHei,sans-serif}
#gameWrap{width:100vw;height:100vh;position:relative;display:flex;align-items:center;justify-content:center;}
#canvas{border:2px solid #446;background:#1c202b;}
.ui-panel{position:absolute;top:12px;left:12px;z-index:10;}
.info{margin-bottom:6px;font-size:18px;}
.pop{
    position:absolute;
    width:360px;
    max-width:calc(100vw - 32px);
    padding:24px;
    background:rgba(0,0,0,0.85);
    border:1px solid #88a;
    border-radius:8px;
    z-index:20;
    text-align:center;
}
.pop button{margin-top:16px;padding:8px 16px;font-size:16px;cursor:pointer}
#rulePop{
    width:420px;
    max-width:calc(100vw - 32px);
    text-align:left;
}
#rulePop h2{text-align:center;margin-bottom:12px}
#rulePop p{margin:6px 0;font-size:15px;line-height:1.5}
#popBox{display:none;}
</style>
</head>
<body>
<div id="gameWrap">
    <canvas id="canvas"></canvas>
    <div class="ui-panel">
        <div class="info">关卡：<span id="levelText">1</span></div>
        <div class="info">剩余时间：<span id="timeText">60</span>s</div>
        <div class="info" id="itemInfo">道具：无</div>
        <div class="info" id="lifeInfo">额外生命：0</div>
    </div>
    <div class="pop" id="rulePop">
        <h2>潜入审判穹顶 - 游戏规则</h2>
        <p>1. WASD控制角色移动，躲避守卫红色扇形视野。</p>
        <p>2. 躲在墙体/活动挡板后方，守卫无法看见你。</p>
        <p>3. 活动挡板在空旷区域来回滑动，不会撞击固定墙体。</p>
        <p>4. 拾取金色道具获得1条额外生命，拾取后移速降低；使用生命后移速恢复正常。</p>
        <p>5. 被守卫发现时，若拥有额外生命，消耗生命免除本次失败；无生命则潜入失败，回到第1关。</p>
        <p>6. 到达绿色圆形终点进入下一关；三关全部抵达终点即任务成功。</p>
        <p>7. 倒计时归零，直接判定潜入失败，回到第1关。</p>
        <button id="startBtn">开始游戏</button>
    </div>
    <div class="pop" id="popBox">
        <h2 id="popTitle"></h2>
        <p id="popMsg"></p>
        <button id="popBtn">返回剧情</button>
        <button id="retryBtn" style="margin-left:12px">重新挑战</button>
    </div>
</div>
<audio id="bgm" loop>
    <source src="../audios/game4.mp3" type="audio/mpeg">
</audio>
<script>
const canvas = document.getElementById("canvas");
document.getElementById("bgm").volume = Math.min(1, Math.max(0, parseFloat(localStorage.getItem("feather_erosion_bgm_volume") || "1")));
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("levelText");
const timeText = document.getElementById("timeText");
const itemInfo = document.getElementById("itemInfo");
const lifeInfo = document.getElementById("lifeInfo");
const popBox = document.getElementById("popBox");
const popTitle = document.getElementById("popTitle");
const popMsg = document.getElementById("popMsg");
const popBtn = document.getElementById("popBtn");
const retryBtn = document.getElementById("retryBtn");
const rulePop = document.getElementById("rulePop");
const startBtn = document.getElementById("startBtn");
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");
canvas.width = 900;
canvas.height = 520;
let keys = {};
// 玩家速度上调
let player = {x:60,y:260,r:12,baseSpeed:4.0,speed:4.0,facing:"front"};
let currentLevel = 1;
let timer = null;
let remainTime = 60;
let gameRun = false;
let result = null;
let extraLife = 0;
let lastTs = 0;

const SPRITE_FILES = {
    blue:{front:"blue_rogue_front",back:"blue_rogue_back",left:"blue_rogue_left",right:"blue_rogue_right"},
    mask:{front:"red_knight_mask_front",back:"red_knight_mask_back",left:"red_knight_mask_left",right:"red_knight_mask_right"},
    visor:{front:"red_knight_visor_front",back:"red_knight_visor_back",left:"red_knight_visor_left",right:"red_knight_visor_right"}
};
const SPRITES = {};
const SPRITE_HEIGHT = 56;
Object.keys(SPRITE_FILES).forEach(function(kind){
    SPRITES[kind] = {};
    Object.keys(SPRITE_FILES[kind]).forEach(function(dir){
        const img = new Image();
        img.src = "../images/game4/" + SPRITE_FILES[kind][dir] + ".png";
        SPRITES[kind][dir] = img;
    });
});
const LIFE_IMG = new Image();
LIFE_IMG.src = "../images/game4/life.png";
const PORTAL_IMG = new Image();
PORTAL_IMG.src = "../images/game4/chuansongmen.png";
const LIFE_HEIGHT = 46;
const PORTAL_HEIGHT = 64;
function angleToFacing(ang){
    let a = ang;
    while(a < 0) a += Math.PI*2;
    while(a >= Math.PI*2) a -= Math.PI*2;
    if(a >= Math.PI/4 && a < Math.PI*3/4) return "front";
    if(a >= Math.PI*3/4 && a < Math.PI*5/4) return "left";
    if(a >= Math.PI*5/4 && a < Math.PI*7/4) return "back";
    return "right";
}
function drawChar(img,x,y,h){
    if(img && img.complete && img.naturalWidth){
        const w = h * img.naturalWidth / img.naturalHeight;
        ctx.drawImage(img, x - w/2, y - h/2, w, h);
        return true;
    }
    return false;
}
const levels = [
    {
        time:65,
        walls:[
            {x:200,y:0,w:24,h:160},
            {x:200,y:260,w:24,h:260},
            {x:640,y:140,w:24,h:240}
        ],
        movingWalls:[
            {x:320,y:180,w:130,h:24,minX:320,maxX:460,speed:0.8,dir:1}
        ],
        pickups:[{x:360,y:400,r:14,got:false}],
        goal:{x:820,y:260,r:28},
        guards:[
            {
                type:"mask",
                x:300,y:80,
                route:[{x:300,y:80},{x:300,y:240}],
                routeIdx:0,
                speed:1.1,
                viewAngle:Math.PI/2.4,
                viewLen:140,
                dir:0,
                r:14
            },
            {
                type:"visor",
                x:520,y:260,
                route:[{x:420,y:260},{x:600,y:260}],
                routeIdx:0,
                speed:1.0,
                viewAngle:Math.PI/2.6,
                viewLen:130,
                dir:0,
                r:14
            }
        ]
    },
    {
        time:72,
        walls:[
            {x:160,y:0,w:24,h:140},
            {x:160,y:220,w:24,h:300},
            {x:580,y:80,w:24,h:180},
            {x:580,y:300,w:24,h:220}
        ],
        movingWalls:[
            {x:280,y:140,w:130,h:24,minX:280,maxX:420,speed:1.0,dir:1},
            {x:440,y:360,w:130,h:24,minX:440,maxX:580,speed:0.9,dir:-1}
        ],
        pickups:[{x:240,y:420,r:14,got:false},{x:720,y:120,r:14,got:false}],
        goal:{x:820,y:420,r:28},
        guards:[
            {
                type:"mask",
                x:260,y:80,
                route:[{x:260,y:80},{x:260,y:220}],
                routeIdx:0,
                speed:1.0,
                viewAngle:Math.PI/2.6,
                viewLen:130,
                dir:0,
                r:14
            },
            {
                type:"visor",
                x:480,y:200,
                route:[{x:380,y:200},{x:560,y:200}],
                routeIdx:0,
                speed:1.2,
                viewAngle:Math.PI/2.6,
                viewLen:120,
                dir:0,
                r:14
            },
            {
                type:"mask",
                x:740,y:340,
                route:[
                    {x:740,y:340},
                    {x:740,y:220},
                    {x:840,y:220},
                    {x:840,y:340}
                ],
                routeIdx:0,
                speed:1.1,
                viewAngle:Math.PI/2.6,
                viewLen:120,
                dir:0,
                r:14
            }
        ]
    },
    {
        time:80,
        walls:[
            {x:120,y:0,w:24,h:220},
            {x:120,y:300,w:24,h:220},
            {x:320,y:100,w:24,h:180},
            {x:320,y:340,w:24,h:180},
            {x:540,y:160,w:24,h:220},
            {x:700,y:0,w:24,h:200},
            {x:700,y:280,w:24,h:240}
        ],
        // 重新设计第三关活动挡板，路线互不干涉，不会互相碰撞、不会和固定墙重叠
        movingWalls:[
            {x:200,y:120,w:110,h:24,minX:200,maxX:300,speed:0.9,dir:1},
            {x:420,y:380,w:110,h:24,minX:420,maxX:520,speed:1.0,dir:-1},
            {x:600,y:100,w:24,h:110,minY:100,maxY:200,speed:0.8,dir:1}
        ],
        pickups:[{x:220,y:420,r:14,got:false},{x:440,y:240,r:14,got:false}],
        goal:{x:830,y:260,r:28},
        guards:[
            {
                type:"visor",
                x:240,y:80,
                route:[{x:240,y:80},{x:240,y:240}],
                routeIdx:0,
                speed:0.9,
                viewAngle:Math.PI/2.8,
                viewLen:135,
                dir:0,
                r:14
            },
            {
                type:"mask",
                x:440,y:280,
                route:[{x:360,y:280},{x:520,y:280}],
                routeIdx:0,
                speed:1.2,
                viewAngle:Math.PI/2.8,
                viewLen:125,
                dir:0,
                r:14
            },
            {
                type:"visor",
                x:620,y:360,
                route:[
                    {x:620,y:360},
                    {x:620,y:220},
                    {x:760,y:220},
                    {x:760,y:360}
                ],
                routeIdx:0,
                speed:1.0,
                viewAngle:Math.PI/2.8,
                viewLen:130,
                dir:0,
                r:14
            }
        ]
    }
];
let walls = [];
let movingWalls = [];
let guards = [];
let goal = null;
let pickups = [];
function rectOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function guardHitWall(x,y,r){
    if(x-r<0||x+r>canvas.width||y-r<0||y+r>canvas.height) return true;
    for(let w of walls){
        if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return true;
    }
    for(let w of movingWalls){
        if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return true;
    }
    return false;
}
function loadLevel(lv){
    const d = levels[lv-1];
    walls = d.walls;
    movingWalls = JSON.parse(JSON.stringify(d.movingWalls));
    guards = JSON.parse(JSON.stringify(d.guards));
    pickups = JSON.parse(JSON.stringify(d.pickups));
    goal = d.goal;
    player.x = 60;
    player.y = 260;
    player.speed = player.baseSpeed;
    remainTime = d.time;
    levelText.textContent = lv;
    timeText.textContent = remainTime;
    itemInfo.textContent = "道具：无";
    lifeInfo.textContent = "额外生命："+extraLife;
    gameRun = true;
    lastTs = performance.now();
    if(timer) clearInterval(timer);
    timer = setInterval(()=>{
        if(!gameRun) return;
        remainTime--;
        timeText.textContent = remainTime;
        if(remainTime <= 0){
            gameOver(false,"时间耗尽，潜入失败");
        }
    },1000);
}
function lineIntersectRect(x1,y1,x2,y2,rect){
    const r = rect;
    const left = r.x, right=r.x+r.w, top=r.y, bot=r.y+r.h;
    const lines = [
        [[left,top],[right,top]],
        [[right,top],[right,bot]],
        [[right,bot],[left,bot]],
        [[left,bot],[left,top]]
    ];
    for(let seg of lines){
        if(segIntersect(x1,y1,x2,y2,seg[0][0],seg[0][1],seg[1][0],seg[1][1])) return true;
    }
    return false;
}
function segIntersect(x1,y1,x2,y2,x3,y3,x4,y4){
    const ccw=(ax,ay,bx,by,cx,cy)=>{
        return (cy-ay)*(bx-ax)-(by-ay)*(cx-ax);
    }
    const A=ccw(x1,y1,x2,y2,x3,y3);
    const B=ccw(x1,y1,x2,y2,x4,y4);
    const C=ccw(x3,y3,x4,y4,x1,y1);
    const D=ccw(x3,y3,x4,y4,x2,y2);
    return ((A>0)!=(B>0)) && ((C>0)!=(D>0));
}
function isSpotted(g){
    const dx = player.x - g.x;
    const dy = player.y - g.y;
    const dist = Math.hypot(dx,dy);
    if(dist > g.viewLen) return false;
    let ang = Math.atan2(dy,dx);
    let diff = ang - g.dir;
    while(diff>Math.PI) diff -= Math.PI*2;
    while(diff<-Math.PI) diff += Math.PI*2;
    if(Math.abs(diff) > g.viewAngle/2) return false;
    const allObstacles = [...walls,...movingWalls];
    for(let w of allObstacles){
        if(lineIntersectRect(g.x,g.y,player.x,player.y,w)) return false;
    }
    return true;
}
function hitWall(x,y,r){
    if(x-r<0||x+r>canvas.width||y-r<0||y+r>canvas.height) return true;
    const allObstacles = [...walls,...movingWalls];
    for(let w of allObstacles){
        if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return true;
    }
    return false;
}
function updateMovingWalls(dt){
    for(let w of movingWalls){
        if(w.minX !== undefined){
            w.x += w.speed * w.dir * dt * 80;
            if(w.x <= w.minX){
                w.x = w.minX;
                w.dir = 1;
            }
            if(w.x >= w.maxX){
                w.x = w.maxX;
                w.dir = -1;
            }
        }else if(w.minY !== undefined){
            w.y += w.speed * w.dir * dt *80;
            if(w.y <= w.minY){
                w.y = w.minY;
                w.dir = 1;
            }
            if(w.y >= w.maxY){
                w.y = w.maxY;
                w.dir = -1;
            }
        }
    }
}
function updateGuards(dt){
    for(let g of guards){
        const tar = g.route[g.routeIdx];
        const dx = tar.x - g.x;
        const dy = tar.y - g.y;
        const dist = Math.hypot(dx,dy);
        if(dist < g.speed * dt * 80){
            g.routeIdx = (g.routeIdx+1) % g.route.length;
        }else{
            const ang = Math.atan2(dy,dx);
            let nx = g.x + Math.cos(ang)*g.speed * dt *80;
            let ny = g.y + Math.sin(ang)*g.speed * dt *80;
            if(!guardHitWall(nx, ny, g.r)){
                g.x = nx;
                g.y = ny;
                g.dir = ang;
            }else{
                g.routeIdx = (g.routeIdx+1) % g.route.length;
            }
        }
    }
}
function checkPickup(){
    for(let p of pickups){
        if(p.got) continue;
        const d = Math.hypot(player.x-p.x, player.y-p.y);
        if(d < player.r + p.r){
            p.got = true;
            extraLife += 1;
            player.speed = player.baseSpeed * 0.65;
            itemInfo.textContent = "道具：已拾取（移速降低）";
            lifeInfo.textContent = "额外生命："+extraLife;
        }
    }
}
function updatePlayer(dt){
    let nx=player.x, ny=player.y;
    let dx=0, dy=0;
    if(keys["w"]||keys["W"]||keys["ArrowUp"]) dy -= 1;
    if(keys["s"]||keys["S"]||keys["ArrowDown"]) dy += 1;
    if(keys["a"]||keys["A"]||keys["ArrowLeft"]) dx -= 1;
    if(keys["d"]||keys["D"]||keys["ArrowRight"]) dx += 1;
    if(dx!==0) player.facing = dx>0 ? "right" : "left";
    else if(dy!==0) player.facing = dy>0 ? "front" : "back";
    const move = player.speed * dt * 60;
    nx += dx*move;
    ny += dy*move;
    if(!hitWall(nx,player.y,player.r)) player.x=nx;
    if(!hitWall(player.x,ny,player.r)) player.y=ny;
    checkPickup();
}
function render(){
    ctx.fillStyle="#1c202b";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(gameRun){
        ctx.fillStyle="#444858";
        for(let w of walls) ctx.fillRect(w.x,w.y,w.w,w.h);
        ctx.fillStyle="#606678";
        for(let w of movingWalls) ctx.fillRect(w.x,w.y,w.w,w.h);
        for(let p of pickups){
            if(!p.got){
                if(!drawChar(LIFE_IMG, p.x, p.y, LIFE_HEIGHT)){
                    ctx.fillStyle="#ffdd44";
                    ctx.beginPath();
                    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                    ctx.fill();
                }
            }
        }
        if(!drawChar(PORTAL_IMG, goal.x, goal.y, PORTAL_HEIGHT)){
            ctx.fillStyle="#28a858";
            ctx.beginPath();
            ctx.arc(goal.x,goal.y,goal.r,0,Math.PI*2);
            ctx.fill();
        }
        for(let g of guards){
            ctx.save();
            ctx.translate(g.x,g.y);
            ctx.rotate(g.dir);
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.arc(0,0,g.viewLen,-g.viewAngle/2,g.viewAngle/2);
            ctx.closePath();
            ctx.fillStyle="rgba(220,60,60,0.22)";
            ctx.fill();
            ctx.restore();
        }
        for(let g of guards){
            const spr = SPRITES[g.type] || SPRITES.mask;
            const gImg = spr[angleToFacing(g.dir)];
            if(!drawChar(gImg, g.x, g.y, SPRITE_HEIGHT)){
                ctx.fillStyle="#dd4444";
                ctx.beginPath();
                ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
                ctx.fill();
            }
        }
        const pImg = SPRITES.blue[player.facing];
        if(!drawChar(pImg, player.x, player.y, SPRITE_HEIGHT)){
            ctx.fillStyle="#44bbff";
            ctx.beginPath();
            ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
            ctx.fill();
        }
    }
}
function gameOver(isWin,msg){
    gameRun = false;
    clearInterval(timer);
    result = isWin ? "win" : "fail";
    popBox.style.display="block";
    popTitle.textContent = isWin ? "任务成功" : "任务失败";
    popMsg.textContent = msg;
    if(!isWin && extraLife <= 0){
        currentLevel = 1;
    }
}
popBtn.onclick = ()=>{
    popBox.style.display="none";
    document.getElementById("bgm").pause();
    fadeNav(`story-${mode}.html?game4Result=${result}`);
};
retryBtn.onclick = ()=>{
    popBox.style.display="none";
    loadLevel(currentLevel);
};
function handleDetected(){
    if(extraLife > 0){
        extraLife--;
        player.speed = player.baseSpeed;
        itemInfo.textContent = "道具：已使用，移速恢复";
        lifeInfo.textContent = "额外生命：" + extraLife;
        gameRun = false;
        clearInterval(timer);
        popBox.style.display = "block";
        popTitle.textContent = "被守卫发现";
        popMsg.textContent = "你已消耗一条额外生命，3秒后重新开始本关";
        popBtn.style.display = "none";
        retryBtn.style.display = "none";
        let count = 3;
        const countTimer = setInterval(()=>{
            count--;
            popMsg.textContent = `你已消耗一条额外生命，${count}秒后重新开始本关`;
            if(count <= 0){
                clearInterval(countTimer);
                popBox.style.display = "none";
                popBtn.style.display = "";
                retryBtn.style.display = "";
                loadLevel(currentLevel);
            }
        },1000);
    }
    else gameOver(false,"被守卫发现，潜入失败，一切需要从头再来");
}
function loop(ts){
    const dt = Math.min((ts - lastTs)/1000, 0.05);
    lastTs = ts;
    if(gameRun){
        updateMovingWalls(dt);
        updatePlayer(dt);
        updateGuards(dt);
        for(let g of guards){
            if(isSpotted(g)){
                handleDetected();
                break;
            }
        }
        const gd = Math.hypot(player.x-goal.x,player.y-goal.y);
        if(gd < goal.r){
            if(currentLevel >=3){
                gameOver(true,"全部关卡潜入成功！");
            }else{
                currentLevel++;
                loadLevel(currentLevel);
            }
        }
    }
    render();
    requestAnimationFrame(loop);
}
startBtn.onclick = function(){
    rulePop.style.display="none";
    document.getElementById("bgm").play().catch(e=>{});
    loadLevel(currentLevel);
}
window.addEventListener("keydown",e=>{keys[e.key]=true})
window.addEventListener("keyup",e=>{keys[e.key]=false})
requestAnimationFrame(loop);
</script>
