<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="../js/transition.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽蚀纪｜世界大地图</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}
.map-container{
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}
.map-stage{
    position: relative;
    width: min(100%, calc(100vh * 16 / 9));
    aspect-ratio: 16/9;
}
.world-map-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.map-hotspot{
    position: absolute;
    cursor: pointer;
    background:rgba(255,0,0,0.25);
}
.map-hotspot::after{
    content: attr(data-name);
    position: absolute;
    left: 50%;
    top: -32px;
    transform: translateX(-50%);
    color:#e8d6b0;
    font-size:14px;
    white-space: nowrap;
    display: none;
}
.map-hotspot:hover::after{
    display:block;
}
.action-hud{
    position:absolute;
    top:24px;
    left:24px;
    color:#ffffff;
    font-size:18px;
    text-shadow: 0 0 4px #000;
    z-index: 10;
}

/* 成就系统按钮 */
.btn-ach {
    position: fixed;
    top: 70px;
    left: 35px;
    width: 70px;
    height: 70px;
    z-index: 9999;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.btn-ach img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* 鼠标经过稍微放大 */
.btn-ach:hover {
    transform: scale(1.08);
}

/* 鼠标提示 */
.achievement-tip {
    position: absolute;
    top: 50%;
    left: 80px;
    transform: translateY(-50%);
    white-space: nowrap;
    padding: 7px 12px;
    background: rgba(10, 12, 18, 0.92);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    color: var(--text);
    font-size: 14px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.btn-ach:hover .achievement-tip {
    opacity: 1;
    visibility: visible;
}

    </style>
</head>
<body>
<div class="map-container">
    <div class="map-stage">
    <img class="world-map-img" src="../images/world_map.jpg" alt="世界地图">
    <div class="map-hotspot" id="map-sky" data-name="天空之城" data-target="map-sky.html" style="left:28%;top:4%;width:44%;height:46%;"></div>
    <div class="map-hotspot" id="map-empire" data-name="帝国城邦" data-target="map-empire.html" style="left:1%;top:30%;width:34%;height:64%;"></div>
    <div class="map-hotspot" id="map-forest" data-name="精灵之森" data-target="map-forest.html" style="left:62%;top:14%;width:37%;height:76%;"></div>
    <div class="map-hotspot" id="map-under" data-name="地下古堡" data-target="map-under.html" style="left:27%;top:54%;width:46%;height:45%;"></div>
    <div class="map-hotspot" id="map-ruins" data-name="废墟驿站" data-target="story-empire.html" style="left:42%;top:30%;width:16%;height:40%;"></div>
    </div>
    <!--左上角行动点显示-->
    <div class="action-hud">剩余行动点：<span id="apText">4</span></div>
    <!-- 成就系统按钮 -->
    <div class="btn-ach" onclick="turnNav('achievement.html')">
        <img src="../images/miniachieve.jpg" alt="成就系统">
        <div class="achievement-tip">成就</div>
    </div>
</div>
<script src="../js/bgm.js"></script>
<script src="../js/turn.js"></script>
<script src="../js/map.js"></script>
</body>
</html>
