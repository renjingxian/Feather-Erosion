<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>羽蚀纪｜世界大地图</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}
.map-container{
    width: 100%;
    height: 100%;
    position: relative;
}
.world-map-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.map-hotspot{
    position: absolute;
    cursor: pointer;
    background:rgba(255,0,0,0.25);
}
.map-hotspot::after{
    content: attr(data-name);
    position: absolute;
    left: 50%;
    top: -32px;
    transform: translateX(-50%);
    color:#e8d6b0;
    font-size:14px;
    white-space: nowrap;
    display: none;
}
.map-hotspot:hover::after{
    display:block;
}
.action-hud{
    position:absolute;
    top:24px;
    left:24px;
    color:#ffffff;
    font-size:18px;
    text-shadow: 0 0 4px #000;
    z-index: 10;
}
.func-btn{
    position:absolute;
    bottom:30px;
    padding:10px 18px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border:1px solid #fff;
    border-radius:4px;
    cursor:pointer;
    font-size:16px;
    z-index:10;
}
.btn-ach{
    left:30px;
}
.btn-item{
    left:140px;
}
.func-btn:hover{
    background:rgba(255,255,255,0.25);
}
.custom-modal{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}
.modal-box{
    background:rgba(255,255,255,0.85);
    color:#222;
    padding:24px 32px;
    border-radius:8px;
    text-align:center;
}
.modal-box p{
    font-size:18px;
    margin-bottom:16px;
}
.modal-box button{
    padding:6px 16px;
    cursor:pointer;
}
    </style>
</head>
<body>
<div class="map-container">
    <img class="world-map-img" src="../images/world_map.jpg" alt="世界地图">
    <!--左上角行动点显示-->
    <div class="action-hud">剩余行动点：<span id="apText">4</span></div>
    <div class="map-hotspot" id="map-sky" data-name="天空之城" data-target="map-sky.html" style="left:28%;top:4%;width:44%;height:46%;"></div>
    <div class="map-hotspot" id="map-empire" data-name="帝国城邦" data-target="map-empire.html" style="left:1%;top:30%;width:34%;height:64%;"></div>
    <div class="map-hotspot" id="map-forest" data-name="精灵之森" data-target="map-forest.html" style="left:62%;top:14%;width:37%;height:76%;"></div>
    <div class="map-hotspot" id="map-under" data-name="地下古堡" data-target="map-under.html" style="left:27%;top:54%;width:46%;height:45%;"></div>
    <!--仅保留成就、物品两个按钮-->
    <div class="func-btn btn-ach" onclick="location.href='achievements.html'">成就</div>
    <div class="func-btn btn-item" onclick="location.href='things.html'">物品</div>
</div>
<script src="saveTool.js"></script>
<script src="../js/map.js"></script>
</body>
</html>
