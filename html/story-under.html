<!DOCTYPE html> 
<html lang="zh-CN"> 
<head>
    <script src="../js/transition.js"></script>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>羽蚀纪｜地下古堡</title> 
    <link rel="stylesheet" href="../css/common.css"> 
    <link rel="stylesheet" href="../css/story.css"> 
</head> 
<body>

    <div class="settings-overlay" id="settingsOverlay" hidden>
        <div class="settings-modal">
            <h2 class="settings-title">设置</h2>
            <div class="settings-volume">
                <span class="settings-volume-label">音乐音量</span>
                <input type="range" id="bgmVolume" min="0" max="100" value="100" step="1" />
            </div>
            <div class="settings-volume">
                <span class="settings-volume-label">音效音量</span>
                <input type="range" id="sfxVolume" min="0" max="100" value="100" step="1" />
            </div>
            <button class="settings-btn" id="settingsContinue" type="button">返回游戏</button>
            <button class="settings-btn settings-btn-danger" id="settingsSaveExit" type="button">保存并退出</button>
            <button class="settings-btn settings-btn-danger" id="settingsRestart" type="button">重新开始</button>
        </div>
    </div>
 
    <!-- 生命值 -->
    <div id="vitals-box" class="vitals-box">
        <div class="vital-row">
            <span class="vital-label">生命</span>
            <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
            <span class="hp-value" id="hp-value">100/100</span>
        </div>
    </div>

    <!-- 四族主要 NPC 好感度 -->
    <div id="affection-box" class="affection-box">

        <div class="affection-item">
            <span class="affection-name">格里姆</span>
            <span class="affection-heart">♥</span>
            <span id="affection-value">5</span>
            <div id="affection-tip" class="affection-tip">
                格里姆好感度：5
            </div>
        </div>

        <div class="affection-item">
            <span class="affection-name">奥德里克</span>
            <span class="affection-heart">♥</span>
            <span id="affection-empire-value">0</span>
            <div id="affection-empire-tip" class="affection-tip">
                奥德里克好感度：0
            </div>
        </div>

        <div class="affection-item">
            <span class="affection-name">艾拉瑞亚</span>
            <span class="affection-heart">♥</span>
            <span id="affection-forest-value">0</span>
            <div id="affection-forest-tip" class="affection-tip">
                艾拉瑞亚好感度：0
            </div>
        </div>

        <div class="affection-item">
            <span class="affection-name">赛琳</span>
            <span class="affection-heart">♥</span>
            <span id="affection-sky-value">0</span>
            <div id="affection-sky-tip" class="affection-tip">
                赛琳好感度：0
            </div>
        </div>

    </div>
 
    <!-- 状态栏 --> 
    <div id="status-box" class="status-box"> 
        <div class="status-title">当前状态</div> 
        <div id="status-list"></div> 
    </div> 
 
    <div class="status-box intel-box"> 
        <div class="status-title">获得情报</div> 
        <div id="intel-list"></div> 
    </div> 
 
    <div class="story-wrap"> 
        <div class="map-mini" id="mapMini"> 
            <img src="../images/minimap.jpg" alt="地图"> 
            <div id="mapTip" class="map-tip">商人的地图</div> 
        </div> 
 
        <!-- 背包 --> 
        <div class="bag-mini" id="bagMini"> 
            <img src="../images/bag.jpg" alt="背包"> 
            <div class="bag-tip">破旧的行囊</div> 
        </div> 
 
        <!-- 物品栏 --> 
        <div class="inventory-panel" id="inventoryPanel"> 
            <div class="inventory-header"> 
                <span>破旧的行囊</span> 
                <button id="inventoryClose">×</button> 
            </div> 
            <div class="inventory-content" id="inventoryContent"></div> 
        </div> 
 
        <!-- 物品详情 --> 
        <div class="item-detail" id="itemDetail"> 
            <div class="item-detail-name" id="itemDetailName"></div> 
            <div class="item-detail-desc" id="itemDetailDesc"></div> 
            <div class="item-detail-count" id="itemDetailCount"></div> 
        </div> 
 
        <!-- 成就系统按钮 --> 
        <div class="achievement-mini" onclick="turnNav('achievement.html')"> 
            <img src="../images/miniachieve.jpg" alt="成就系统"> 
            <div class="achievement-tip">成就</div> 
        </div> 
 
        <div class="char-silhouette-wrap"> 
            <div class="char-silhouette" id="silhouetteDom"></div> 
        </div> 
 
        <div class="story-box" id="textDom"></div> 
        <div class="option-box" id="choiceDom"></div> 
 
        <div class="hint" id="hint">点击画面 / Enter / Space / ▸键 继续</div> 
        <div id="storyBg" class="story-bg"></div> 
    </div> 
 
    <script src="../js/auth.js"></script> 
    <script src="../js/save.js"></script>
    <script src="../js/bgm.js"></script> 
    <script src="../js/click.js"></script>
    <script src="../js/turn.js"></script>
    <script src="../js/achievement-toast.js"></script>
    <script src="../js/story-under.js"></script>
    <script src="../js/task.js"></script>
</body>
</html>
