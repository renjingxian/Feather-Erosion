<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="../js/transition.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽蚀纪：天空的悼亡曲</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/story.css">
</head>
<body>

    <div class="settings-overlay" id="settingsOverlay" hidden>
        <div class="settings-modal">
            <h2 class="settings-title">设置</h2>
            <div class="settings-volume">
                <span class="settings-volume-label">音乐音量</span>
                <input type="range" id="bgmVolume" min="0" max="100" value="100" step="1" />
            </div>
            <div class="settings-volume">
                <span class="settings-volume-label">音效音量</span>
                <input type="range" id="sfxVolume" min="0" max="100" value="100" step="1" />
            </div>
            <button class="settings-btn" id="settingsContinue" type="button">返回游戏</button>
            <button class="settings-btn settings-btn-danger" id="settingsSaveExit" type="button">保存并退出</button>
            <button class="settings-btn settings-btn-danger" id="settingsRestart" type="button">重新开始</button>
        </div>
    </div>
<div class="story-wrap">
    <!-- 动态背景视频 -->
    <video id="storyBgVideo" class="story-bg-video" playsinline></video>
    <!-- 独立剧情视频 -->
    <div class="video-block" id="videoBlock">
        <video id="storyVideo" playsinline></video>
        <div class="skip-video">点击画面或按 Enter / Space / → 跳过</div>
    </div>

    <div class="char-silhouette-wrap">
        <div class="char-silhouette" id="silhouetteDom"></div>
    </div>

    <div class="story-box" id="textDom"></div>
    <div class="option-box" id="choiceDom"></div>

    <div id="storyBg" class="story-bg"></div>

    <div class="hint" id="hint">点击画面 / Enter / Space / ▸键 继续</div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/save.js"></script>
<script src="../js/bgm.js"></script>
<script src="../js/click.js"></script>
<script src="../js/turn.js"></script>
<script src="../js/prologue.js"></script>
</body>
</html>
