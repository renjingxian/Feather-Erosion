<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>我的自我介绍</title>
  <link rel="stylesheet" href="../css/person1.css" />
</head>
<body>
  <div class="card">
    <img src="../images/myphoto.jpg" alt="我的照片" class="avatar" />
    <h1>你好，我是吴咫静</h1>
    <p>
      我是吴咫静，目前就读于北京理工大学，平时喜欢阅读和写作。
      从接触游戏开发以来，我慢慢爱上了把想法变成能跑起来的画面的感觉。
      在这次的游戏项目里，我主要负责项目计划、项目日志撰写与会议记录以及整个项目的提交。
      借此机会，我学习了更多关于游戏设计与制作的知识。
    </p>
    <p>
      生活中我是个安静慢热且热爱生活的人。
      同时我也愿意学习，渴望进步。
      本次游戏开发项目对我来说是一次富有挑战也富有趣味的经历。
      我觉得做游戏最有意思的地方，是它能把美术、程序、剧情和交互揉在一起，
      让玩家真正"走进"我们搭出来的小世界。
      希望通过这次作品，能让玩到的人会心一笑。
    </p>
    <p>感谢你点开我的介绍页，咱们游戏里见！</p>

    <button onclick="history.back()">返回上一页</button>
  </div>
</body>
</html>
